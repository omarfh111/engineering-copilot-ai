spring.application.name=copilote
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]
spring.profiles.default=dev

# --- Database Configuration with CI/Local Fallbacks ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/copilote_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Fixes: "Unable to determine Dialect without JDBC metadata" during Jenkins mvn test
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.port=8081

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

app.bootstrap.admin.enabled=false
app.bootstrap.admin.first-name=${BOOTSTRAP_ADMIN_FIRST_NAME:Platform}
app.bootstrap.admin.last-name=${BOOTSTRAP_ADMIN_LAST_NAME:Admin}
app.bootstrap.admin.username=${BOOTSTRAP_ADMIN_USERNAME:admin}
app.bootstrap.admin.email=${BOOTSTRAP_ADMIN_EMAIL:admin@copilote.dev}
app.bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:admin123}

spring.docker.compose.enabled=false

# --- FastAPI AI service (RAG microservice) ---
ai.service.base-url=${AI_SERVICE_BASE_URL:http://localhost:8000}
ai.service.connect-timeout=5s
ai.service.response-timeout=${AI_SERVICE_RESPONSE_TIMEOUT:180s}
ai.service.internal-api-key=${AI_INTERNAL_API_KEY:dev-secret-key}

# Document Storage
app.document-storage.location=${DOCUMENT_STORAGE_PATH:./storage/documents}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# CORS settings
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# Mail Configuration
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:eyadabbaghi2601@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS_ENABLE:true}
app.mail.from=${MAIL_FROM:${spring.mail.username}}