spring.application.name=copilote
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/copilote_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres123}
server.port=8081

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

app.bootstrap.admin.enabled=true
app.bootstrap.admin.first-name=Platform
app.bootstrap.admin.last-name=Admin
app.bootstrap.admin.username=admin
app.bootstrap.admin.email=admin@copilote.dev
app.bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:change-me-before-starting}

spring.docker.compose.enabled=false

# --- FastAPI AI service (RAG microservice) ---
# Base URL is read from the AI_SERVICE_BASE_URL env var so the endpoint is not
# hard-coded; falls back to the local dev address. React must NEVER call this
# service directly: the flow is React -> Spring Boot -> FastAPI.
ai.service.base-url=${AI_SERVICE_BASE_URL:http://localhost:8000}
ai.service.connect-timeout=5s
ai.service.response-timeout=90s
ai.service.internal-api-key=${AI_INTERNAL_API_KEY:}

# Original documents are owned by Spring Boot. FastAPI receives a temporary
# multipart copy for indexing and never receives a local filesystem path.
app.document-storage.location=${DOCUMENT_STORAGE_PATH:./storage/documents}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
