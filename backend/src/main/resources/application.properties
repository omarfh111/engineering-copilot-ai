spring.application.name=copilote
spring.config.import=optional:file:.env[.properties]
spring.profiles.default=dev

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
server.port=8081

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

app.bootstrap.admin.enabled=false
app.bootstrap.admin.first-name=${BOOTSTRAP_ADMIN_FIRST_NAME:Platform}
app.bootstrap.admin.last-name=${BOOTSTRAP_ADMIN_LAST_NAME:Admin}
app.bootstrap.admin.username=${BOOTSTRAP_ADMIN_USERNAME:admin}
app.bootstrap.admin.email=${BOOTSTRAP_ADMIN_EMAIL:admin@copilote.dev}
app.bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD}

spring.docker.compose.enabled=false

# --- FastAPI AI service (RAG microservice) ---
# Base URL is read from the AI_SERVICE_BASE_URL env var so the endpoint is not
# hard-coded; falls back to the local dev address. React must NEVER call this
# service directly: the flow is React -> Spring Boot -> FastAPI.
ai.service.base-url=${AI_SERVICE_BASE_URL}
ai.service.connect-timeout=5s
# A complete repository audit can run several bounded agents. Keep this above
# the FastAPI agent timeout so Spring receives a structured PARTIAL result.
ai.service.response-timeout=${AI_SERVICE_RESPONSE_TIMEOUT:180s}
ai.service.internal-api-key=${AI_INTERNAL_API_KEY}

# Original documents are owned by Spring Boot. FastAPI receives a temporary
# multipart copy for indexing and never receives a local filesystem path.
app.document-storage.location=${DOCUMENT_STORAGE_PATH:./storage/documents}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Production must set the explicitly allowed browser origins, for example
# https://copilot.example.com. Wildcard origins are intentionally not supported.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
